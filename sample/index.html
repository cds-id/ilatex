<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>CKEditor 5 LaTeX Plugin Demo</title>
		<script type="module" src="/main.ts"></script>
	</head>
	<body>
		<main>
			<h1>CKEditor 5 LaTeX Plugin Demo</h1>

				<p>Inline formula: <span class="latex-math" data-latex="E=mc^2">E=mc^2</span></p>
				<p>Shortcode: [%x\lt2%]</p>
				<p>[%16\Large\frac{1}{3}%] satuan luas</p>
			</div>
		</main>
	</body>
