<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>LaTeX Static Render (no editor)</title>
		<script type="module" src="/render-demo.ts"></script>
	</head>
	<body>
		<main>
			<h1>Static LaTeX Render — no editor</h1>

			<article id="content">
				<p>Shortcode inline: [%x\lt2%]</p>
				<p>[%16\Large\frac{1}{3}%] satuan luas</p>
				<p>Editor HTML output: <span class="latex-math" data-latex="E=mc^2">E=mc^2</span></p>
				<p>Mixed: energy [%E=mc^2%] and ratio [%\frac{a}{b}%] inline.</p>
			</article>
		</main>
	</body>
</html>
